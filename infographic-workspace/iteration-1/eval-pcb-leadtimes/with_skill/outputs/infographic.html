<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#0f0a06;">
<div style="width:1920px;height:1080px;position:relative;overflow:hidden;background:#0f0a06;font-family:system-ui,-apple-system,Helvetica,Arial,sans-serif;color:#fff;text-align:center;">

<!-- Background: PCB trace pattern -->
<svg style="position:absolute;top:0;left:0;width:1920px;height:1080px;opacity:0.07;" viewBox="0 0 1920 1080">
<defs>
<pattern id="pcb" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M10 40 L30 40 L30 10 L50 10" fill="none" stroke="#ff6600" stroke-width="1.5"/>
<circle cx="50" cy="10" r="3" fill="none" stroke="#ff6600" stroke-width="1"/>
<circle cx="10" cy="40" r="3" fill="none" stroke="#ff6600" stroke-width="1"/>
<path d="M60 70 L60 50 L80 50" fill="none" stroke="#ff6600" stroke-width="1.5"/>
<circle cx="60" cy="70" r="2.5" fill="#ff6600"/>
<rect x="35" y="55" width="8" height="5" fill="none" stroke="#ff6600" stroke-width="1" rx="1"/>
</pattern>
</defs>
<rect width="1920" height="1080" fill="url(#pcb)"/>
</svg>

<!-- Radial orb top-left -->
<div style="position:absolute;top:-200px;left:-100px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(255,102,0,0.12) 0%,transparent 70%);"></div>
<!-- Radial orb bottom-right -->
<div style="position:absolute;bottom:-250px;right:-50px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(255,102,0,0.08) 0%,transparent 70%);"></div>

<!-- Main content layout: two columns -->
<div style="position:absolute;top:0;left:0;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;text-align:center;">

<!-- Left column: hero stat + context -->
<div style="width:760px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 60px 60px 80px;">

<!-- Company logo placeholder -->
<img alt="Cu Circuits" src="" style="height:72px;width:auto;margin-bottom:32px;" />

<!-- Label -->
<div style="font-size:18px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:#ff6600;margin-bottom:16px;text-align:center;">HIGH-TG LAMINATE LEAD TIME</div>

<!-- Hero number -->
<div style="font-size:120px;font-weight:900;letter-spacing:-3px;color:#fff;line-height:1;margin-bottom:8px;text-align:center;">140</div>
<div style="font-size:28px;font-weight:700;color:rgba(255,255,255,0.7);margin-bottom:40px;text-align:center;">DAYS AND CLIMBING</div>

<!-- Before/After bar comparison SVG -->
<svg viewBox="0 0 500 180" width="500" height="180" style="margin-bottom:24px;">
<text x="250" y="20" text-anchor="middle" fill="#ff6600" font-size="16" font-weight="700" letter-spacing="2" font-family="system-ui">STANDARD FR-4 LEAD TIME</text>
<!-- Before bar -->
<rect x="80" y="36" width="36" height="40" rx="2" fill="rgba(255,255,255,0.15)"/>
<text x="98" y="62" text-anchor="middle" fill="#fff" font-size="18" font-weight="900" font-family="system-ui">5</text>
<text x="98" y="92" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="system-ui">WAS</text>
<!-- Arrow -->
<line x1="148" y1="56" x2="220" y2="56" stroke="#ff6600" stroke-width="2"/>
<polygon points="220,50 234,56 220,62" fill="#ff6600"/>
<!-- After bar -->
<rect x="250" y="36" width="130" height="40" rx="2" fill="#ff6600"/>
<text x="315" y="62" text-anchor="middle" fill="#fff" font-size="18" font-weight="900" font-family="system-ui">18</text>
<text x="315" y="92" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="system-ui">NOW</text>
<!-- Days label -->
<text x="250" y="130" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="system-ui">DAYS</text>
<!-- Multiplier -->
<text x="250" y="165" text-anchor="middle" fill="#ff6600" font-size="22" font-weight="900" font-family="system-ui">3.6x INCREASE</text>
</svg>

</div>

<!-- Vertical divider -->
<div style="width:2px;height:700px;background:linear-gradient(to bottom,transparent,rgba(255,102,0,0.3),rgba(255,102,0,0.3),transparent);"></div>

<!-- Right column: data viz -->
<div style="width:760px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 80px 60px 60px;">

<!-- AI Server Demand chart -->
<div style="margin-bottom:36px;text-align:center;">
<div style="font-size:18px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:#ff6600;margin-bottom:16px;text-align:center;">AI SERVER DEMAND (YoY)</div>
<svg viewBox="0 0 520 200" width="520" height="200">
<!-- Area chart showing demand surge -->
<defs>
<linearGradient id="demandGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ff6600" stop-opacity="0.4"/>
<stop offset="100%" stop-color="#ff6600" stop-opacity="0.02"/>
</linearGradient>
</defs>
<!-- Grid lines -->
<line x1="60" y1="30" x2="490" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<line x1="60" y1="80" x2="490" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<line x1="60" y1="130" x2="490" y2="130" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<line x1="60" y1="170" x2="490" y2="170" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<!-- Area fill -->
<path d="M80 160 L180 145 L280 120 L380 80 L470 30 L470 170 L80 170 Z" fill="url(#demandGrad)"/>
<!-- Line -->
<path d="M80 160 L180 145 L280 120 L380 80 L470 30" fill="none" stroke="#ff6600" stroke-width="3"/>
<!-- Data points -->
<circle cx="80" cy="160" r="4" fill="#ff6600"/>
<circle cx="180" cy="145" r="4" fill="#ff6600"/>
<circle cx="280" cy="120" r="4" fill="#ff6600"/>
<circle cx="380" cy="80" r="4" fill="#ff6600"/>
<circle cx="470" cy="30" r="6" fill="#ff6600" stroke="#fff" stroke-width="2"/>
<!-- Labels -->
<text x="80" y="190" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="system-ui">2021</text>
<text x="180" y="190" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="system-ui">2022</text>
<text x="280" y="190" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="system-ui">2023</text>
<text x="380" y="190" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="system-ui">2024</text>
<text x="470" y="190" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="system-ui">2025</text>
<!-- Peak label -->
<text x="470" y="20" text-anchor="middle" fill="#ff6600" font-size="18" font-weight="900" font-family="system-ui">+340%</text>
<!-- Y axis -->
<text x="40" y="34" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="14" font-family="system-ui">HIGH</text>
<text x="40" y="174" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="14" font-family="system-ui">LOW</text>
</svg>
</div>

<!-- Copper price gauge -->
<div style="margin-bottom:36px;text-align:center;">
<div style="font-size:18px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:#ff6600;margin-bottom:12px;text-align:center;">COPPER PRICE PER TONNE</div>
<svg viewBox="0 0 400 130" width="400" height="130">
<!-- Gauge arc background -->
<path d="M50 110 A130 130 0 0 1 350 110" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="12" stroke-linecap="round"/>
<!-- Gauge arc filled -->
<path d="M50 110 A130 130 0 0 1 310 55" fill="none" stroke="#ff6600" stroke-width="12" stroke-linecap="round"/>
<!-- Center value -->
<text x="200" y="95" text-anchor="middle" fill="#fff" font-size="44" font-weight="900" font-family="system-ui">$13,300</text>
<text x="200" y="120" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="16" font-family="system-ui">LME SPOT</text>
<!-- Min/max labels -->
<text x="50" y="125" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="14" font-family="system-ui">$8K</text>
<text x="350" y="125" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="14" font-family="system-ui">$15K</text>
</svg>
</div>

<!-- Supply chain timeline -->
<div style="text-align:center;">
<div style="font-size:18px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:#ff6600;margin-bottom:16px;text-align:center;">SUPPLY CHAIN PRESSURE</div>
<svg viewBox="0 0 520 120" width="520" height="120">
<!-- Connecting line -->
<line x1="60" y1="50" x2="460" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
<!-- Filled progress line -->
<line x1="60" y1="50" x2="380" y2="50" stroke="#ff6600" stroke-width="4"/>
<!-- Node 1: Raw Materials -->
<circle cx="60" cy="50" r="16" fill="#0f0a06" stroke="#ff6600" stroke-width="3"/>
<path d="M52 50 L60 42 L68 50 L60 58 Z" fill="#ff6600"/>
<text x="60" y="85" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">RAW</text>
<text x="60" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">MATERIALS</text>
<!-- Node 2: Laminates -->
<circle cx="193" cy="50" r="16" fill="#0f0a06" stroke="#ff6600" stroke-width="3"/>
<rect x="185" y="43" width="16" height="14" rx="1" fill="#ff6600"/>
<text x="193" y="85" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">LAMINATE</text>
<text x="193" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">PRODUCTION</text>
<!-- Node 3: PCB Fab -->
<circle cx="326" cy="50" r="16" fill="#0f0a06" stroke="#ff6600" stroke-width="3"/>
<path d="M318 44 L334 44 L334 56 L318 56 Z M322 44 L322 56 M326 44 L326 56 M330 44 L330 56" fill="none" stroke="#ff6600" stroke-width="1.5"/>
<text x="326" y="85" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">PCB</text>
<text x="326" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">FABRICATION</text>
<!-- Node 4: Delivery (not filled) -->
<circle cx="460" cy="50" r="16" fill="#0f0a06" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
<text x="460" y="85" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="system-ui">DELIVERY</text>
<text x="460" y="102" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="system-ui">DELAYED</text>
<!-- Alert icon on node 3 -->
<text x="340" y="30" text-anchor="middle" fill="#ff6600" font-size="16" font-weight="900" font-family="system-ui">!</text>
</svg>
</div>

</div>

</div>

<!-- Footer -->
<div style="position:absolute;bottom:0;left:0;width:1920px;text-align:center;">
<div style="width:1920px;height:1px;background:rgba(255,255,255,0.1);"></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 80px;">
<div style="font-size:13px;color:rgba(255,255,255,0.35);text-align:center;">cucircuits.com</div>
<div style="font-size:13px;color:rgba(255,255,255,0.35);text-align:center;">Source: ILFA GmbH, LME, Industry Reports 2025</div>
</div>
</div>

</div>
</body>
</html>
